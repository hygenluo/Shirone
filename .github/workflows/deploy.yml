# 生产重建触发器
#
# ├─ 部署模型（依据官方文档 docs/zh-CN/04-deployment/）
# │    1. 托管平台（Vercel）以「源码模式」构建本仓库 `main` 分支，构建命令
# │       `pnpm build`、产物目录 `dist`（见根目录 vercel.json），构建过程中通过
# │       平台环境变量 `CONTENT_REPO_URL` 拉取私有内容仓。
# │       → 对应文档《云托管平台 Deploy Hook 部署》
# │    2. 内容仓推送 → 内容校验 → 派发 `content-updated` 事件 → 本工作流
# │       → 调用平台 Deploy Hook → 平台重新构建并发布。
# │       → 派发链路对应文档《GitHub Actions 跨仓自动构建》
# │
# ├─ 为什么本工作流刻意不拉取内容、不构建、不推送产物分支
# │    * 内容仓已设为私有，跨仓读取需要额外的 CONTENT_REPO_TOKEN；
# │    * 本仓库是公开仓库，任何内容副本（例如原先的 `pages` 产物分支）都会把
# │      文章正文乃至未发布的草稿一并公开，与「内容私有」的目标直接冲突；
# │    * 真正的构建由托管平台完成，与本地 `pnpm build` 等价（同样的
# │      content:sync + astro build + pagefind + fonts:check 流程）。
# │
# ├─ 所需 Secrets
# │    - VERCEL_DEPLOY_HOOK : 平台部署钩子地址，**必须绑定 `main` 分支**
# │      内容仓推送不会改动本仓库的任何分支，线上刷新完全依赖这个钩子。
# │
# └─ 托管平台必须配置的环境变量
#      CONTENT_REPO_URL     = https://x-access-token:<TOKEN>@github.com/hygenluo/blogs.git
#      GIT_TERMINAL_PROMPT  = 0
#      NODE_VERSION         = 22
#
# 其余平台变体见同目录 deploy.yml.example。

name: Deploy

on:
  # 主题代码变更。
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "rules/**"
      - "README*.md"
      - "*.md"
  # 内容仓推送后由内容仓的 trigger-build.yml 派发。
  repository_dispatch:
    types: [content-updated]
  # 手动触发。
  workflow_dispatch: {}
  # 兜底：派发事件偶尔会丢，每天重建一次保证最终一致。
  schedule:
    - cron: "17 4 * * *"

# 同一时间只允许一个流水线运行；新请求取消进行中的旧构建。
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger production rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 防止网络异常导致请求挂起，浪费 Actions 额度
    steps:
      - name: Resolve trigger source
        id: source
        # client_payload 属于外部输入，经 env 传递而不是直接内插进脚本。
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "content_ref=${PAYLOAD_SHA:-main}" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT_NAME" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        # 未配置该 Secret 时静默跳过，流水线仍为绿色。
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 30 \
            -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Summarize
        if: always()
        env:
          EVENT_NAME: ${{ steps.source.outputs.event }}
          CONTENT_REF: ${{ steps.source.outputs.content_ref }}
          HOOK_CONFIGURED: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        run: |
          set -euo pipefail
          {
            echo "### Shirone deploy trigger"
            echo ""
            echo "- 触发来源：\`${EVENT_NAME}\`"
            echo "- 内容 ref：\`${CONTENT_REF}\`"
            echo "- Deploy Hook 已配置：${HOOK_CONFIGURED}"
            echo ""
            echo "构建与发布由托管平台完成（源码模式构建 \`main\`）。"
          } >> "$GITHUB_STEP_SUMMARY"
